name: Build Windows MSIX

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    env:
      MSIX_PFX_PATH: ''

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Initialize MSIX Config
        shell: pwsh
        run: |
          $configPath = "src-tauri/gen/windows/bundle.config.json"

          if (-not (Test-Path $configPath)) {
            npx -y @choochmeque/tauri-windows-bundle@latest init
          }

          if (-not (Test-Path $configPath)) {
            throw "bundle.config.json was not created."
          }

      - name: Install dependencies
        run: npm install

      - name: Build Frontend
        run: npm run build

      - name: Configure MSIX Identity
        shell: pwsh
        run: |
          $configPath = "src-tauri/gen/windows/bundle.config.json"
          $config = Get-Content $configPath -Raw | ConvertFrom-Json

          $config | Add-Member -MemberType NoteProperty -Name "publisher" -Value "CN=50CA2AC2-0155-44AC-B2B0-47100A3FB6E2" -Force
          $config | Add-Member -MemberType NoteProperty -Name "publisherDisplayName" -Value "Aegis Vault Authenticator" -Force

          $config | ConvertTo-Json -Depth 20 | Set-Content $configPath -Encoding UTF8

      - name: Configure AppxManifest
        shell: pwsh
        run: |
          $manifestPath = "src-tauri/gen/windows/AppxManifest.xml.template"

          if (-not (Test-Path $manifestPath)) {
            throw "AppxManifest.xml.template not found."
          }

          [xml]$xml = Get-Content $manifestPath -Raw

          $xml.Package.Identity.Name = "HappyRecorder3D.AegisVault"
          $xml.Package.Identity.Publisher = "CN=50CA2AC2-0155-44AC-B2B0-47100A3FB6E2"
          $xml.Package.Properties.PublisherDisplayName = "Aegis Vault Authenticator"

          $xml.Save((Resolve-Path $manifestPath))

      - name: Decode signing certificate
        shell: pwsh
        env:
          MSIX_PFX_BASE64: ${{ secrets.MSIX_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace("$env:MSIX_PFX_BASE64")) {
            Write-Host "No signing certificate supplied. Continuing without PFX."
            exit 0
          }

          $bytes = [Convert]::FromBase64String("$env:MSIX_PFX_BASE64")
          $pfxPath = "$env:RUNNER_TEMP\signing.pfx"

          [IO.File]::WriteAllBytes($pfxPath, $bytes)

          "MSIX_PFX_PATH=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify MSIX Builder
        shell: pwsh
        run: |
          npx tauri-windows-bundle --version

      - name: Build MSIX
        run: npm run tauri:windows:build
        env:
          TAURI_WINDOWS_BUNDLE_PFX_PATH: ${{ env.MSIX_PFX_PATH }}
          TAURI_WINDOWS_BUNDLE_PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegis-vault-authenticator-msix
          path: |
            src-tauri/target/msix/*.msix
            src-tauri/target/msix/*.msixbundle
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/msix/*.msix
            src-tauri/target/msix/*.msixbundle
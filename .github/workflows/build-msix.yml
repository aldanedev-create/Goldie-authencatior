name: Build Windows MSIX

on:
  push:
    branches: [main]       # Runs automatically on push to main
    tags:
      - 'v*'               # Runs on tag pushes like v1.0.0
  workflow_dispatch: {}    # Allows manual trigger button in Actions tab

jobs:
  build:
    runs-on: windows-latest
    env:
      MSIX_PFX_PATH: ''
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

      - name: Ensure MSIX config exists & inject Store Identity
        run: |
          npx -y @choochmeque/tauri-windows-bundle@latest init
          npx -y @choochmeque/tauri-windows-bundle@latest set-identity \
            --name "HappyRecorder3D.AegisVault" \
            --publisher "CN=50CA2AC2-0155-44AC-B2B0-47100A3FB6E2" \
            --publisher-display-name "Happy Recorder 3D"
        shell: bash

      - name: Decode signing certificate
        env:
          MSIX_PFX_BASE64: ${{ secrets.MSIX_PFX_BASE64 }}
        if: env.MSIX_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String("$env:MSIX_PFX_BASE64")
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\signing.pfx", $bytes)
          echo "MSIX_PFX_PATH=$env:RUNNER_TEMP\signing.pfx" >> $env:GITHUB_ENV

      - name: Build MSIX
        run: npm run tauri:windows:build
        env:
          TAURI_WINDOWS_BUNDLE_PFX_PATH: ${{ env.MSIX_PFX_PATH }}
          TAURI_WINDOWS_BUNDLE_PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: authenticator-msix
          path: src-tauri/gen/windows/**/*.msix
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/gen/windows/**/*.msix